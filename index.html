<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Digital Library Vault - Unlimited</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
    .animate-scale-in { animation: scaleIn 0.2s ease-out; }
    
    .transition-all-smooth {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      animation: slideIn 0.3s ease-out;
    }
    
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .dark .skeleton {
      background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
      background-size: 200% 100%;
    }
    
    .drag-active {
      background-color: rgba(79, 70, 229, 0.1) !important;
      border-color: #4f46e5 !important;
    }
    
    .modal-backdrop {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    
    .upload-progress-bar {
      transition: width 0.3s ease;
    }

    .infinite-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <!-- Upload Progress Modal -->
  <div id="upload-progress-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0"></div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-lg relative animate-scale-in max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Uploading Files</h3>
        <span onclick="closeUploadProgress()" class="text-gray-400 hover:text-gray-600 cursor-pointer text-xl" role="button" tabindex="0">&times;</span>
      </div>
      <div id="upload-progress-list" class="space-y-3 overflow-y-auto flex-1"></div>
      <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex justify-between text-sm text-gray-500 mb-2">
          <span id="upload-status-text">Preparing...</span>
          <span id="upload-count-text">0/0</span>
        </div>
        <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
          <div id="total-upload-bar" class="upload-progress-bar bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-20 w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 shadow-lg transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
      <div class="p-6 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl">
            <i class="fas fa-vault text-2xl text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
              Library Vault
            </h1>
            <p class="text-xs text-gray-500 dark:text-gray-400">Unlimited Storage</p>
          </div>
        </div>
      </div>
      
      <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
        <button onclick="switchView('dashboard')" data-nav="dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all-smooth hover:bg-gray-100 dark:hover:bg-gray-700 text-left group">
          <i class="fas fa-tachometer-alt w-5 text-gray-400 group-hover:text-indigo-500 transition-colors"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="switchView('library')" data-nav="library" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all-smooth hover:bg-gray-100 dark:hover:bg-gray-700 text-left group">
          <i class="fas fa-folder-open w-5 text-gray-400 group-hover:text-indigo-500 transition-colors"></i>
          <span>My Library</span>
        </button>
        <button onclick="switchView('favorites')" data-nav="favorites" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all-smooth hover:bg-gray-100 dark:hover:bg-gray-700 text-left group">
          <i class="fas fa-star w-5 text-gray-400 group-hover:text-yellow-500 transition-colors"></i>
          <span>Favorites</span>
        </button>
        <button onclick="switchView('recent')" data-nav="recent" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all-smooth hover:bg-gray-100 dark:hover:bg-gray-700 text-left group">
          <i class="fas fa-history w-5 text-gray-400 group-hover:text-indigo-500 transition-colors"></i>
          <span>Recently Viewed</span>
        </button>
        
        <div class="pt-6">
          <div class="flex items-center justify-between px-4 mb-3">
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-400">Folders</p>
            <span onclick="createNewFolder()" class="text-gray-400 hover:text-indigo-500 transition-colors cursor-pointer" role="button" tabindex="0">
              <i class="fas fa-plus-circle"></i>
            </span>
          </div>
          <div id="folder-list" class="space-y-1"></div>
        </div>
      </nav>

      <div class="p-4 border-t border-gray-200 dark:border-gray-700 space-y-3">
        <div id="storage-indicator" class="px-2">
          <div class="flex justify-between text-xs text-gray-500 mb-2">
            <span>Storage Used</span>
            <span id="storage-text">0 B</span>
          </div>
          <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 overflow-hidden">
            <div id="storage-bar" class="infinite-bg h-full rounded-full transition-all-smooth" style="width: 100%"></div>
          </div>
          <p class="text-xs text-gray-400 mt-1 text-center">Unlimited • Auto-Chunked</p>
        </div>
        
        <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all-smooth">
          <i id="dark-icon" class="fas fa-moon w-5"></i>
          <span>Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-10 md:hidden" onclick="closeSidebar()"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-gray-50 dark:bg-gray-900">
      <!-- Header -->
      <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-700 p-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button id="menu-toggle" class="md:hidden text-2xl text-gray-600 dark:text-gray-300 hover:text-indigo-500 transition-colors" onclick="toggleSidebar()">
              <i class="fas fa-bars"></i>
            </button>
            <h2 id="view-title" class="text-2xl font-bold">Dashboard</h2>
          </div>
          
          <div class="flex items-center gap-3">
            <div class="relative hidden lg:block group">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-indigo-500 transition-colors"></i>
              <input type="text" id="search-input" placeholder="Search documents..." 
                     class="pl-12 pr-4 py-2.5 bg-gray-100 dark:bg-gray-700 rounded-xl text-sm w-72 outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-gray-600 transition-all-smooth"
                     oninput="handleSearch()">
            </div>
            
            <button onclick="triggerUpload()" id="upload-btn" 
                    class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 transition-all-smooth hover:shadow-lg hover:scale-105 active:scale-95">
              <i class="fas fa-cloud-upload-alt"></i>
              <span class="hidden sm:inline">Upload</span>
            </button>
            
            <div id="user-area" class="flex items-center gap-2"></div>
          </div>
        </div>
        
        <div class="mt-3 lg:hidden relative">
          <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="search-input-mobile" placeholder="Search documents..." 
                 class="w-full pl-12 pr-4 py-2.5 bg-gray-100 dark:bg-gray-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                 oninput="syncSearch()">
        </div>
      </header>

      <!-- Dynamic Content -->
      <div id="dynamic-view" class="flex-1 overflow-y-auto p-6">
        <div id="loading-state" class="hidden flex items-center justify-center h-full">
          <div class="text-center">
            <i class="fas fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
            <p class="text-gray-500">Loading...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Hidden File Input - Accept ALL file types -->
  <input type="file" id="global-file-input" class="hidden" multiple accept="*/*">

  <!-- Rename Modal -->
  <div id="rename-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0" onclick="closeRenameModal()"></div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md relative animate-scale-in">
      <h3 class="text-lg font-semibold mb-4">Rename Document</h3>
      <input type="text" id="rename-input" class="w-full px-4 py-3 border rounded-xl dark:bg-gray-700 dark:border-gray-600 outline-none focus:ring-2 focus:ring-indigo-500 mb-4" placeholder="Enter new name">
      <div class="flex gap-3 justify-end">
        <button onclick="closeRenameModal()" class="px-4 py-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all-smooth">Cancel</button>
        <button onclick="confirmRename()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all-smooth">Rename</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, getDocs, doc as firestoreDoc, deleteDoc, updateDoc, serverTimestamp, writeBatch, where } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA8hSkj1otveM4q96I3vD-gaH_lxAi7C00",
  authDomain: "library-91af8.firebaseapp.com",
  databaseURL: "https://library-91af8-default-rtdb.firebaseio.com",
  projectId: "library-91af8",
  storageBucket: "library-91af8.firebasestorage.app",
  messagingSenderId: "483457038231",
  appId: "1:483457038231:web:3f3daa7d4b3110c71cf6d2"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Constants for chunking
    const CHUNK_SIZE = 700 * 1024; // 700KB per chunk (safe under 1MB limit)
    
    // Global State
    window.db = db;
    window.auth = auth;
    window.currentUser = null;
    window.currentDocuments = [];
    window.allDocuments = [];
    window.viewMode = 'grid';
    window.darkMode = localStorage.getItem('theme') === 'dark';
    window.favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    window.recentlyViewed = JSON.parse(localStorage.getItem('recentlyViewed') || '[]');
    window.currentFolder = 'root';
    window.folders = JSON.parse(localStorage.getItem('folders') || '["Work", "Personal", "School"]');
    window.renameDocId = null;
    window.isUploading = false;
    window.uploadProgress = {};
    window.currentView = 'dashboard';
    window.searchQuery = '';
    window.totalStorageUsed = 0;

    // Apply dark mode
    if (window.darkMode) {
      document.documentElement.classList.add('dark');
      const icon = document.getElementById('dark-icon');
      if (icon) icon.className = 'fas fa-sun w-5';
    }

    // ---------- Toast Notifications ----------
    window.showToast = (message, type = 'success') => {
      const container = document.getElementById('toast-container');
      const icons = {
        success: 'fa-check-circle text-green-500',
        error: 'fa-exclamation-circle text-red-500',
        info: 'fa-info-circle text-blue-500',
        warning: 'fa-exclamation-triangle text-yellow-500'
      };
      
      const toast = document.createElement('div');
      toast.className = 'toast animate-slide-in bg-white dark:bg-gray-800 rounded-xl shadow-lg p-4 flex items-center gap-3 min-w-[300px]';
      toast.innerHTML = `
        <i class="fas ${icons[type]} text-xl"></i>
        <p class="text-sm flex-1">${message}</p>
        <span onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 cursor-pointer" role="button" tabindex="0">
          <i class="fas fa-times"></i>
        </span>
      `;
      
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    // ---------- UI Functions ----------
    window.toggleDarkMode = () => {
      window.darkMode = !window.darkMode;
      document.documentElement.classList.toggle('dark', window.darkMode);
      localStorage.setItem('theme', window.darkMode ? 'dark' : 'light');
      const icon = document.getElementById('dark-icon');
      if (icon) {
        icon.className = window.darkMode ? 'fas fa-sun w-5' : 'fas fa-moon w-5';
      }
    };

    window.toggleSidebar = () => {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    };

    window.closeSidebar = () => {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    };

    window.switchView = (view) => {
      window.currentView = view;
      window.searchQuery = '';
      const searchInput = document.getElementById('search-input');
      const searchMobile = document.getElementById('search-input-mobile');
      if (searchInput) searchInput.value = '';
      if (searchMobile) searchMobile.value = '';
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-50', 'dark:bg-indigo-900/40', 'text-indigo-600', 'font-semibold');
      });
      const activeBtn = document.querySelector(`[data-nav="${view}"]`);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-50', 'dark:bg-indigo-900/40', 'text-indigo-600', 'font-semibold');
      }
      
      const titles = {
        dashboard: 'Dashboard',
        library: 'My Library',
        favorites: '⭐ Favorites',
        recent: '🕐 Recently Viewed'
      };
      
      document.getElementById('view-title').innerText = titles[view] || 'Dashboard';
      
      showLoading();
      
      setTimeout(() => {
        switch(view) {
          case 'dashboard': renderDashboard(); break;
          case 'library': renderLibrary(); break;
          case 'favorites': renderFavorites(); break;
          case 'recent': renderRecent(); break;
        }
        hideLoading();
      }, 200);
      
      if (window.innerWidth < 768) closeSidebar();
    };

    window.showLoading = () => {
      const loader = document.getElementById('loading-state');
      if (loader) loader.classList.remove('hidden');
    };

    window.hideLoading = () => {
      const loader = document.getElementById('loading-state');
      if (loader) loader.classList.add('hidden');
    };

    window.triggerUpload = () => {
      document.getElementById('global-file-input').click();
    };

    window.closeUploadProgress = () => {
      if (!window.isUploading) {
        document.getElementById('upload-progress-modal').classList.add('hidden');
      }
    };

    // ---------- Authentication ----------
    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      const userArea = document.getElementById('user-area');
      
      if (user) {
        userArea.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="hidden md:block text-right">
              <p class="text-sm font-medium">${user.displayName || user.email?.split('@')[0]}</p>
              <p class="text-xs text-gray-500">${user.email}</p>
            </div>
            <img src="${user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName || 'User')}" 
                 class="w-10 h-10 rounded-full border-2 border-indigo-500" alt="Avatar">
            <button onclick="logout()" class="text-sm bg-gray-100 dark:bg-gray-700 px-3 py-2 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-all-smooth">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        `;
        renderFolders();
        await loadAllDocuments();
        switchView('dashboard');
      } else {
        userArea.innerHTML = '';
        renderAuthView();
        hideLoading();
      }
    });

    window.logout = async () => {
      try {
        await signOut(auth);
        showToast('Logged out successfully', 'success');
      } catch (error) {
        showToast('Error logging out', 'error');
      }
    };

    window.renderFolders = () => {
      const folderList = document.getElementById('folder-list');
      if (!folderList) return;
      folderList.innerHTML = window.folders.map(f => `
        <div class="w-full flex items-center gap-3 px-4 py-2.5 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all-smooth group cursor-pointer"
             onclick="switchToFolder('${f.replace(/'/g, "\\'")}')">
          <i class="fas fa-folder text-yellow-500 w-4"></i>
          <span class="flex-1 text-left">${f}</span>
          <span onclick="event.stopPropagation(); deleteFolder('${f.replace(/'/g, "\\'")}')" 
                class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all cursor-pointer" role="button" tabindex="0">
            <i class="fas fa-times-circle text-xs"></i>
          </span>
        </div>
      `).join('');
    };

    window.switchToFolder = (folderName) => {
      window.currentFolder = folderName;
      switchView('library');
    };

    window.createNewFolder = () => {
      const name = prompt('Enter folder name:')?.trim();
      if (name && !window.folders.includes(name)) {
        window.folders.push(name);
        localStorage.setItem('folders', JSON.stringify(window.folders));
        renderFolders();
        showToast('Folder created', 'success');
      } else if (name) {
        showToast('Folder already exists', 'warning');
      }
    };

    window.deleteFolder = (folderName) => {
      if (confirm(`Delete folder "${folderName}" and move documents to root?`)) {
        window.folders = window.folders.filter(f => f !== folderName);
        localStorage.setItem('folders', JSON.stringify(window.folders));
        
        window.allDocuments.forEach(async (documentData) => {
          if (documentData.folder === folderName) {
            try {
              await updateDoc(firestoreDoc(db, 'users', window.currentUser.uid, 'documents', documentData.id), {
                folder: 'root'
              });
            } catch (error) {
              console.error('Error moving document:', error);
            }
          }
        });
        
        window.allDocuments = window.allDocuments.map(d => 
          d.folder === folderName ? {...d, folder: 'root'} : d
        );
        
        if (window.currentFolder === folderName) {
          window.currentFolder = 'root';
        }
        renderFolders();
        showToast('Folder deleted', 'success');
      }
    };

    // ---------- Auth View ----------
    window.renderAuthView = () => {
      const container = document.getElementById('dynamic-view');
      container.innerHTML = `
        <div class="min-h-full flex items-center justify-center p-4">
          <div class="w-full max-w-md animate-scale-in">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl">
              <div class="text-center mb-8">
                <div class="inline-flex p-4 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-4">
                  <i class="fas fa-vault text-4xl text-white"></i>
                </div>
                <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
                <p class="text-gray-500">Sign in to your unlimited digital vault</p>
              </div>
              
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium mb-2">Email Address</label>
                  <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="auth-email" type="email" placeholder="you@example.com" 
                           class="w-full pl-12 pr-4 py-3.5 border-2 border-gray-200 dark:border-gray-600 rounded-xl dark:bg-gray-700 focus:border-indigo-500 outline-none transition-all-smooth">
                  </div>
                </div>
                <div>

    // ---------- CHUNKED FILE STORAGE (UNLIMITED SIZE) ----------
    
    /**
     * Splits base64 string into chunks and stores them across multiple Firestore documents
     */
    window.storeChunkedFile = async (file, base64Data) => {
      const fileId = 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      const totalChunks = Math.ceil(base64Data.length / CHUNK_SIZE);
      
      // Create metadata document
      const metadataRef = await addDoc(collection(db, 'users', window.currentUser.uid, 'documents'), {
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileSize: file.size,
        uploadDate: serverTimestamp(),
        userId: window.currentUser.uid,
        folder: window.currentFolder,
        isChunked: true,
        fileId: fileId,
        totalChunks: totalChunks,
        chunkSize: CHUNK_SIZE
      });
      
      // Store chunks in a subcollection
      const chunksCollection = collection(db, 'users', window.currentUser.uid, 'documents', metadataRef.id, 'chunks');
      
      for (let i = 0; i < totalChunks; i++) {
        const chunk = base64Data.substring(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
        await addDoc(chunksCollection, {
          chunkIndex: i,
          data: chunk,
          fileId: fileId
        });
        
        // Update progress
        window.uploadProgress[file.name] = {
          progress: Math.round(50 + ((i + 1) / totalChunks) * 50),
          status: 'saving',
          size: file.size,
          chunks: `${i + 1}/${totalChunks}`
        };
        updateUploadProgressUI();
      }
      
      return metadataRef;
    };
    
    /**
     * Reassembles chunks back into full base64 string
     */
    window.reassembleFile = async (documentData) => {
      if (!documentData.isChunked) {
        // Legacy non-chunked file
        return documentData.base64Data;
      }
      
      const chunksCollection = collection(
        db, 'users', window.currentUser.uid, 'documents', documentData.id, 'chunks'
      );
      const chunksQuery = query(chunksCollection, orderBy('chunkIndex'));
      const chunksSnapshot = await getDocs(chunksQuery);
      
      const chunks = [];
      chunksSnapshot.forEach(chunkDoc => {
        chunks.push(chunkDoc.data().data);
      });
      
      return chunks.join('');
    };
    
    /**
     * Deletes all chunks for a chunked document
     */
    window.deleteChunks = async (docId) => {
      const chunksCollection = collection(db, 'users', window.currentUser.uid, 'documents', docId, 'chunks');
      const chunksSnapshot = await getDocs(chunksCollection);
      
      const batch = writeBatch(db);
      chunksSnapshot.forEach(chunkDoc => {
        batch.delete(chunkDoc.ref);
      });
      await batch.commit();
    };

    // ---------- Database Operations ----------
    window.loadAllDocuments = async () => {
      if (!window.currentUser) return;
      try {
        const q = query(
          collection(db, 'users', window.currentUser.uid, 'documents'),
          orderBy('uploadDate', 'desc')
        );
        const snapshot = await getDocs(q);
        window.allDocuments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        window.totalStorageUsed = window.allDocuments.reduce((acc, d) => acc + (d.fileSize || 0), 0);
        updateStorageIndicator(window.totalStorageUsed);
      } catch (error) {
        console.error('Error loading documents:', error);
        window.allDocuments = [];
      }
    };

    window.uploadFileToFirestore = async (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        
        reader.onloadstart = () => {
          window.uploadProgress[file.name] = { progress: 0, status: 'reading', size: file.size };
          updateUploadProgressUI();
          document.getElementById('upload-progress-modal').classList.remove('hidden');
        };
        
        reader.onprogress = (e) => {
          if (e.lengthComputable) {
            window.uploadProgress[file.name] = { 
              progress: Math.round((e.loaded / e.total) * 50),
              status: 'reading',
              size: file.size
            };
            updateUploadProgressUI();
          }
        };
        
        reader.onload = async (e) => {
          try {
            const base64Data = e.target.result;
            
            // Check if file needs chunking (> 700KB base64)
            if (base64Data.length > CHUNK_SIZE) {
              window.uploadProgress[file.name] = { 
                progress: 50, 
                status: 'chunking', 
                size: file.size,
                chunks: `0/${Math.ceil(base64Data.length / CHUNK_SIZE)}`
              };
              updateUploadProgressUI();
              
              await window.storeChunkedFile(file, base64Data);
            } else {
              // Small file - store directly
              window.uploadProgress[file.name] = { progress: 50, status: 'saving', size: file.size };
              updateUploadProgressUI();
              
              await addDoc(collection(db, 'users', window.currentUser.uid, 'documents'), {
                fileName: file.name,
                fileType: file.type || 'application/octet-stream',
                fileSize: file.size,
                uploadDate: serverTimestamp(),
                base64Data: base64Data,
                userId: window.currentUser.uid,
                folder: window.currentFolder,
                isChunked: false
              });
            }
            
            window.uploadProgress[file.name] = { progress: 100, status: 'complete', size: file.size };
            updateUploadProgressUI();
            resolve();
          } catch (error) {
            window.uploadProgress[file.name] = { progress: 0, status: 'error', error: error.message, size: file.size };
            updateUploadProgressUI();
            reject(error);
          }
        };
        
        reader.onerror = () => {
          window.uploadProgress[file.name] = { progress: 0, status: 'error', error: 'Failed to read file', size: file.size };
          updateUploadProgressUI();
          reject(new Error('Failed to read file'));
        };
        
        reader.readAsDataURL(file);
      });
    };

    window.updateUploadProgressUI = () => {
      const list = document.getElementById('upload-progress-list');
      const statusText = document.getElementById('upload-status-text');
      const countText = document.getElementById('upload-count-text');
      const totalBar = document.getElementById('total-upload-bar');
      
      if (!list) return;
      
      const entries = Object.entries(window.uploadProgress);
      const totalFiles = entries.length;
      const completedFiles = entries.filter(([_, data]) => data.status === 'complete').length;
      const failedFiles = entries.filter(([_, data]) => data.status === 'error').length;
      const totalProgress = entries.reduce((acc, [_, data]) => acc + data.progress, 0) / Math.max(totalFiles, 1);
      
      if (statusText) {
        if (failedFiles > 0) {
          statusText.textContent = `${completedFiles} done, ${failedFiles} failed`;
        } else if (completedFiles === totalFiles && totalFiles > 0) {
          statusText.textContent = 'Upload complete!';
        } else {
          statusText.textContent = 'Uploading...';
        }
      }
      
      if (countText) {
        countText.textContent = `${completedFiles}/${totalFiles}`;
      }
      
      if (totalBar) {
        totalBar.style.width = totalProgress + '%';
      }
      
      list.innerHTML = entries.map(([name, data]) => {
        let statusIcon = '';
        let statusColor = '';
        
        switch(data.status) {
          case 'complete': statusIcon = '✅'; statusColor = 'text-green-500'; break;
          case 'error': statusIcon = '❌'; statusColor = 'text-red-500'; break;
          case 'chunking': statusIcon = '🧩'; statusColor = 'text-purple-500'; break;
          case 'saving': statusIcon = '💾'; statusColor = 'text-blue-500'; break;
          case 'reading': statusIcon = '📖'; statusColor = 'text-yellow-500'; break;
        }
        
        return `
          <div class="flex items-center gap-3 p-2">
            <i class="fas fa-file text-gray-400"></i>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between">
                <p class="text-sm truncate">${name}</p>
                <span class="text-xs ${statusColor}">${statusIcon}</span>
              </div>
              <p class="text-xs text-gray-500">${formatSize(data.size)} ${data.chunks ? '• ' + data.chunks + ' chunks' : ''}</p>
              <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mt-1">
                <div class="upload-progress-bar ${data.status === 'error' ? 'bg-red-500' : 'bg-indigo-500'} h-2 rounded-full" style="width: ${data.progress}%"></div>
              </div>
              ${data.error ? `<p class="text-xs text-red-500 mt-1">${data.error}</p>` : ''}
            </div>
          </div>
        `;
      }).join('');
    };

      window.isUploading = true;

      let uploaded = 0;
      let failed = 0;
      
      for (const file of fileArray) {
        try {
          await uploadFileToFirestore(file);
          uploaded++;
        } catch (error) {
          console.error(`Failed to upload ${file.name}:`, error);
          showToast(`Failed: ${file.name} - ${error.message}`, 'error');
          failed++;
        }
      }
      
      window.isUploading = false;
      uploadBtn.innerHTML = originalHTML;

      if (isGrid) {
        return `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border dark:border-gray-700 p-4 hover-lift group animate-scale-in">
            <div class="flex justify-between items-start mb-3">
              <div class="relative">
                <i class="fas ${getFileIcon(doc.fileType)} text-3xl ${getFileColor(doc.fileType)}"></i>
                ${doc.isChunked ? '<span class="absolute -top-1 -right-1 text-xs" title="Large file (chunked)">🧩</span>' : ''}
              </div>
              <span onclick="toggleFavorite('${doc.id}')" 
                      class="text-lg transition-all-smooth cursor-pointer ${isFav ? 'text-yellow-500 scale-110' : 'text-gray-300'} hover:text-yellow-500 hover:scale-110" role="button" tabindex="0">
                <i class="fas fa-star"></i>
              </span>
            </div>
            <h4 class="font-medium text-sm truncate mb-1" title="${doc.fileName}">${doc.fileName}</h4>
            <p class="text-xs text-gray-500 mb-3">${formatDate(doc.uploadDate)} • ${formatSize(doc.fileSize)}</p>
            <div class="flex gap-1.5 opacity-0 group-hover:opacity-100 transition-all-smooth">
              <button onclick="previewDocument('${doc.id}')" 
                      class="flex-1 py-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 rounded-xl hover:bg-indigo-100 transition-all-smooth text-xs font-medium">
                <i class="fas fa-eye mr-1"></i> View
              </button>
              <button onclick="downloadDocument('${doc.id}')" 
                      class="flex-1 py-2 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 transition-all-smooth text-xs font-medium">
                <i class="fas fa-download mr-1"></i>
              </button>
              <button onclick="openRenameModal('${doc.id}')" 
                      class="py-2 px-2 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 transition-all-smooth text-xs">
                <i class="fas fa-edit"></i>
              </button>
              <button onclick="deleteDocument('${doc.id}')" 
                      class="py-2 px-2 bg-red-50 dark:bg-red-900/30 text-red-500 rounded-xl hover:bg-red-100 transition-all-smooth text-xs">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border dark:border-gray-700 p-4 flex items-center gap-4 hover:shadow-md transition-all-smooth animate-scale-in">
            <div class="relative">
              <i class="fas ${getFileIcon(doc.fileType)} text-2xl ${getFileColor(doc.fileType)} w-8"></i>
              ${doc.isChunked ? '<span class="absolute -top-1 -right-1 text-xs">🧩</span>' : ''}
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-medium text-sm truncate">${doc.fileName}</h4>
              <p class="text-xs text-gray-500">${formatDate(doc.uploadDate)} • ${formatSize(doc.fileSize)}</p>
            </div>
            <div class="flex gap-2">
              <span onclick="toggleFavorite('${doc.id}')" 
                      class="text-lg cursor-pointer ${isFav ? 'text-yellow-500' : 'text-gray-300'} hover:text-yellow-500 transition-all-smooth" role="button" tabindex="0">
                <i class="fas fa-star"></i>
              </span>
              <button onclick="previewDocument('${doc.id}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-sm hover:bg-indigo-100 transition-all-smooth">View</button>
              <button onclick="downloadDocument('${doc.id}')" class="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm hover:bg-gray-200 transition-all-smooth">Download</button>
              <button onclick="deleteDocument('${doc.id}')" class="px-3 py-1.5 bg-red-50 text-red-500 rounded-lg text-sm hover:bg-red-100 transition-all-smooth">Delete</button>
            </div>
          </div>
        `;
      }
    };

    // ---------- Document Actions ----------
    window.previewDocument = async (docId) => {
      const documentData = window.allDocuments.find(d => d.id === docId);
      if (!documentData) return;
      
      addToRecentlyViewed(docId);
      
      showToast('Loading preview...', 'info');
      
      try {
        const fullBase64 = await window.reassembleFile(documentData);
        
        const w = window.open('', '_blank');
        
        if (documentData.fileType.startsWith('image/')) {
          w.document.write(`
            <!DOCTYPE html><html><head><title>${documentData.fileName}</title>
            <style>body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a1a; } img { max-width: 100%; max-height: 100vh; }</style>
            </head><body><img src="${fullBase64}" alt="${documentData.fileName}"></body></html>
          `);
        } else if (documentData.fileType === 'application/pdf') {
          w.document.write(`
            <!DOCTYPE html><html><head><title>${documentData.fileName}</title>
            <style>body { margin: 0; } iframe { width: 100%; height: 100vh; border: none; }</style>
            </head><body><iframe src="${fullBase64}"></iframe></body></html>
          `);
        } else if (documentData.fileType.includes('word') || documentData.fileType.includes('document')) {
          try {
            const base64Content = fullBase64.split(',')[1];
            const binaryString = atob(base64Content);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: documentData.fileType });
            const arrayBuffer = await blob.arrayBuffer();
            const result = await mammoth.convertToHtml({ arrayBuffer });
            w.document.write(`
              <!DOCTYPE html><html><head><title>${documentData.fileName}</title>
              <style>body { font-family: system-ui; padding: 40px; max-width: 800px; margin: auto; background: #fff; }</style>
              </head><body>${result.value}</body></html>
            `);
          } catch (error) {
            w.document.write(`<p>Error previewing: ${error.message}</p><a href="${fullBase64}" download="${documentData.fileName}">Download</a>`);
          }
        } else if (documentData.fileType.startsWith('text/')) {
          const base64Content = fullBase64.split(',')[1];
          const text = atob(base64Content);
          w.document.write(`
            <!DOCTYPE html><html><head><title>${documentData.fileName}</title>
            <style>body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; white-space: pre-wrap; }</style>
            </head><body>${escapeHtml(text)}</body></html>
          `);
        } else {
          w.document.write(`
            <!DOCTYPE html><html><head><title>${documentData.fileName}</title>
            <style>body { font-family: system-ui; padding: 40px; text-align: center; }</style></head>
            <body>
              <h2>${documentData.fileName}</h2>
              <p>File type: ${documentData.fileType}</p>
              <p>Size: ${formatSize(documentData.fileSize)}</p>
              <a href="${fullBase64}" download="${documentData.fileName}" 
                 style="display:inline-block;margin-top:20px;padding:12px 24px;background:#4f46e5;color:white;text-decoration:none;border-radius:8px;">
                Download File
              </a>
            </body></html>
          `);
        }
        
        showToast('Document opened in new tab', 'info');
      } catch (error) {
        showToast('Error loading preview: ' + error.message, 'error');
      }
    };

    window.downloadDocument = async (docId) => {
      const documentData = window.allDocuments.find(d => d.id === docId);
      if (!documentData) return;
      
      showToast('Preparing download...', 'info');
      
      try {
        const fullBase64 = await window.reassembleFile(documentData);
        
        const link = document.createElement('a');
        link.href = fullBase64;
        link.download = documentData.fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast('Download started', 'success');
      } catch (error) {
        showToast('Error downloading: ' + error.message, 'error');
      }
    };

    window.deleteDocument = async (docId) => {
      const documentData = window.allDocuments.find(d => d.id === docId);
      if (!documentData) return;
      if (!confirm(`Delete "${documentData.fileName}"?`)) return;
      
      try {
        showLoading();
        
        // Delete chunks if chunked file
        if (documentData.isChunked) {
          await window.deleteChunks(docId);
        }
        
        // Delete main document
        await deleteDoc(firestoreDoc(db, 'users', window.currentUser.uid, 'documents', docId));
        
        window.allDocuments = window.allDocuments.filter(d => d.id !== docId);
        window.favorites = window.favorites.filter(id => id !== docId);
        window.totalStorageUsed = window.allDocuments.reduce((acc, d) => acc + (d.fileSize || 0), 0);
        localStorage.setItem('favorites', JSON.stringify(window.favorites));
        
        showToast('Document deleted', 'success');
        refreshCurrentView();
      } catch (error) {
        showToast('Error deleting document: ' + error.message, 'error');
        hideLoading();
      }
    };

    window.bulkDelete = async () => {
      const selected = prompt('Delete how many recent documents? (Enter number)');
      if (!selected) return;
      
      const count = parseInt(selected);
      if (isNaN(count) || count <= 0) return;
      
      if (!confirm(`Delete ${Math.min(count, window.allDocuments.length)} most recent documents?`)) return;
      
      try {
        showLoading();
        const toDelete = window.allDocuments.slice(0, count);
        
        // Delete chunks for chunked files
        for (const documentData of toDelete) {
          if (documentData.isChunked) {
            await window.deleteChunks(documentData.id);
          }
        }
        
        const batch = writeBatch(db);
        toDelete.forEach(documentData => {
          const docRef = firestoreDoc(db, 'users', window.currentUser.uid, 'documents', documentData.id);
          batch.delete(docRef);
        });
        
        await batch.commit();
        
        window.allDocuments = window.allDocuments.slice(count);
        window.totalStorageUsed = window.allDocuments.reduce((acc, d) => acc + (d.fileSize || 0), 0);
        
        showToast(`${toDelete.length} documents deleted`, 'success');
        refreshCurrentView();
      } catch (error) {
        showToast('Error deleting documents: ' + error.message, 'error');
        hideLoading();
      }
    };

    window.toggleFavorite = (docId) => {
      let favs = [...window.favorites];
      if (favs.includes(docId)) {
        favs = favs.filter(id => id !== docId);
        showToast('Removed from favorites', 'info');
      } else {
        favs.push(docId);
        showToast('Added to favorites', 'success');
      }
      window.favorites = favs;
      localStorage.setItem('favorites', JSON.stringify(favs));
      refreshCurrentView();
    };

    // ---------- Rename Modal ----------
    window.openRenameModal = (docId) => {
      const documentData = window.allDocuments.find(d => d.id === docId);
      if (!documentData) return;
      
      window.renameDocId = docId;
      document.getElementById('rename-input').value = documentData.fileName;
      document.getElementById('rename-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('rename-input').focus(), 100);
    };

    window.closeRenameModal = () => {
      document.getElementById('rename-modal').classList.add('hidden');
      window.renameDocId = null;
    };

    window.confirmRename = async () => {
      const newName = document.getElementById('rename-input').value.trim();
      if (!newName || !window.renameDocId) return;
      
      try {
        showLoading();
        await updateDoc(firestoreDoc(db, 'users', window.currentUser.uid, 'documents', window.renameDocId), {
          fileName: newName
        });
        
        const documentData = window.allDocuments.find(d => d.id === window.renameDocId);
        if (documentData) {
          documentData.fileName = newName;
        }
        
        closeRenameModal();
        showToast('Document renamed', 'success');
        refreshCurrentView();
      } catch (error) {
        showToast('Error renaming document: ' + error.message, 'error');
        hideLoading();
      }
    };

    // ---------- Search ----------
    window.handleSearch = () => {
      window.searchQuery = document.getElementById('search-input')?.value.toLowerCase() || '';
      
      if (window.currentView === 'library') {
        renderLibrary();
      } else if (window.currentView === 'dashboard' && window.searchQuery) {
        const filtered = window.allDocuments.filter(d => 
          d.fileName.toLowerCase().includes(window.searchQuery)
        );
        const grid = document.getElementById('dashboard-docs-grid');
        if (grid) {
          grid.innerHTML = filtered.length > 0 
            ? filtered.slice(0, 12).map(doc => renderDocumentCard(doc)).join('')
            : '<p class="col-span-full text-center text-gray-500 py-8">No documents found</p>';
        }
      }
    };

    window.syncSearch = () => {
      const mobileInput = document.getElementById('search-input-mobile');
      const desktopInput = document.getElementById('search-input');
      if (mobileInput && desktopInput) {
        desktopInput.value = mobileInput.value;
        handleSearch();
      }
    };

    window.sortDocuments = (sortBy) => {
      let sorted = [...window.currentDocuments];
      switch(sortBy) {
        case 'name':
          sorted.sort((a, b) => a.fileName.localeCompare(b.fileName));
          break;
        case 'size':
          sorted.sort((a, b) => (b.fileSize || 0) - (a.fileSize || 0));
          break;
        case 'date':
        default:
          sorted.sort((a, b) => {
            const dateA = a.uploadDate?.toDate?.() || new Date(0);
            const dateB = b.uploadDate?.toDate?.() || new Date(0);
            return dateB - dateA;
          });
      }
      window.currentDocuments = sorted;
      
      const container = document.getElementById('library-docs-container');
      if (container) {
        container.innerHTML = sorted.map(doc => renderDocumentCard(doc)).join('');
      }
    };

    // ---------- Utility Functions ----------
    window.addToRecentlyViewed = (docId) => {
      let recent = window.recentlyViewed.filter(id => id !== docId);
      recent.unshift(docId);
      window.recentlyViewed = recent.slice(0, 50);
      localStorage.setItem('recentlyViewed', JSON.stringify(window.recentlyViewed));
      
      if (window.currentView === 'recent') {
        renderRecent();
      }
    };

    window.formatSize = (bytes) => {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    };

    window.formatDate = (timestamp) => {
      if (!timestamp) return 'Unknown';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return 'Just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
      
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    };

    window.getFileIcon = (fileType) => {
      if (!fileType) return 'fa-file';
      if (fileType.includes('pdf')) return 'fa-file-pdf';
      if (fileType.includes('word') || fileType.includes('doc')) return 'fa-file-word';
      if (fileType.includes('text')) return 'fa-file-alt';
      if (fileType.includes('image')) return 'fa-file-image';
      if (fileType.includes('video')) return 'fa-file-video';
      if (fileType.includes('audio')) return 'fa-file-audio';
      if (fileType.includes('zip') || fileType.includes('rar') || fileType.includes('compressed')) return 'fa-file-archive';
      if (fileType.includes('spreadsheet') || fileType.includes('excel')) return 'fa-file-excel';
      if (fileType.includes('presentation') || fileType.includes('powerpoint')) return 'fa-file-powerpoint';
      if (fileType.includes('code') || fileType.includes('javascript') || fileType.includes('json')) return 'fa-file-code';
      return 'fa-file';
    };

    window.getFileColor = (fileType) => {
      if (!fileType) return 'text-gray-400';
      if (fileType.includes('pdf')) return 'text-red-500';
      if (fileType.includes('word') || fileType.includes('doc')) return 'text-blue-500';
      if (fileType.includes('text')) return 'text-gray-600';
      if (fileType.includes('image')) return 'text-green-500';
      if (fileType.includes('video')) return 'text-purple-500';
      if (fileType.includes('audio')) return 'text-pink-500';
      if (fileType.includes('zip') || fileType.includes('compressed')) return 'text-yellow-600';
      if (fileType.includes('code')) return 'text-teal-500';
      return 'text-gray-400';
    };

    window.updateStorageIndicator = (totalBytes) => {
      const storageText = document.getElementById('storage-text');
      const storageBar = document.getElementById('storage-bar');
      
      if (storageText) {
        storageText.textContent = formatSize(totalBytes);
      }
      if (storageBar) {
        storageBar.style.width = '100%';
        storageBar.className = 'infinite-bg h-full rounded-full transition-all-smooth';
      }
    };

    window.escapeHtml = (text) => {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'u') {
        e.preventDefault();
        triggerUpload();
      }
      if (e.key === 'Escape') {
        closeRenameModal();
        closeSidebar();
      }
    });

    // Initialize
    console.log('🚀 Digital Library Vault - UNLIMITED with CHUNKING');
    console.log('💡 Files > 700KB are automatically split into chunks for Firestore compatibility');
    console.log('⌨️  Press Ctrl+U to quickly upload files');
  </script>
</body>
</html>
